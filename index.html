<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f0e8" />
    <meta name="description" content="Ton dressing, lu dans Gmail. Tes achats, sans manque ni promo inventés." />
    <title>Hauldump</title>
    <style>
      :root {
        --paper: #f4f0e8;
        --ink: #171713;
        --graphite: #68665f;
        --line: #d9d3c6;
        --bordeaux: #6f2737;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { width: min(640px, calc(100% - 40px)); margin: 0 auto; }
      header { padding: 28px 0 0; }
      .wordmark {
        letter-spacing: 0.22em;
        font-size: 12px;
        font-weight: 650;
        text-decoration: none;
        color: inherit;
      }
      h1, h2 {
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      h1 {
        font-size: clamp(1.85rem, 4.6vw, 2.55rem);
        line-height: 1.14;
        margin: 56px 0 28px;
        max-width: 16ch;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--ink);
        color: var(--paper);
        text-decoration: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        font: inherit;
        font-size: 15px;
        font-weight: 560;
        cursor: pointer;
        min-height: 44px;
      }
      .btn:hover { opacity: 0.92; }
      .kicker {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--bordeaux);
        margin: 0 0 6px;
        font-weight: 650;
      }
      hr.rule { border: 0; border-top: 1px solid var(--line); margin: 48px 0; }
      section.lines { margin: 0 0 8px; }
      article { padding: 20px 0; border-bottom: 1px solid var(--line); }
      article:last-child { border-bottom: 0; }
      article h2 { font-size: 1.35rem; margin: 0; line-height: 1.2; }
      form { margin: 8px 0 56px; }
      form h2 { font-size: 1.35rem; margin: 0 0 16px; }
      label {
        display: block;
        font-size: 13px;
        color: var(--graphite);
        margin: 0 0 6px;
      }
      input[type="email"] {
        width: 100%;
        font: inherit;
        font-size: 16px;
        background: transparent;
        color: var(--ink);
        border: 0;
        border-bottom: 1px solid var(--line);
        border-radius: 0;
        padding: 10px 0;
        margin: 0 0 20px;
      }
      input[type="email"]:focus { outline: none; border-bottom-color: var(--ink); }
      #status {
        display: none;
        margin: 14px 0 0;
        color: var(--graphite);
        font-size: 13px;
      }
      #status.show { display: block; }
      footer {
        padding: 0 0 48px;
        color: var(--graphite);
        font-size: 13px;
      }
      footer p { margin: 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <a class="wordmark" href="#">HAULDUMP</a>
      </header>

      <h1>Ton dressing, lu dans Gmail. Tes achats, sans manque ni promo inventés.</h1>
      <a class="btn" href="#waitlist">Rejoindre</a>

      <hr class="rule" />

      <section class="lines" aria-label="Hauldump">
        <article>
          <p class="kicker">Dressing</p>
          <h2>Tes commandes, rangées.</h2>
        </article>
        <article>
          <p class="kicker">Découvrir</p>
          <h2>Une piste à la fois.</h2>
        </article>
        <article>
          <p class="kicker">Plan</p>
          <h2>Suivre le prix, pas une newsletter.</h2>
        </article>
      </section>

      <hr class="rule" />

      <form id="waitlist" novalidate>
        <p class="kicker">Bêta</p>
        <h2>Liste d’attente.</h2>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="toi@exemple.fr" />
        <button class="btn" type="submit">Envoyer</button>
        <p id="status" role="status"></p>
      </form>

      <footer>
        <p>Gmail, lecture seule. Gratuit pour commencer.</p>
      </footer>
    </div>
    <script>
      const form = document.getElementById("waitlist");
      const status = document.getElementById("status");
      const NOTE_KEY = "hauldump-waitlist-note";
      function showQuiet() {
        status.className = "show";
        status.textContent = "Rien n’a été envoyé. Pas de boîte pour l’instant.";
      }
      try {
        const saved = localStorage.getItem(NOTE_KEY);
        if (saved) {
          document.getElementById("email").value = saved;
          showQuiet();
        }
      } catch (e) {}
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        const email = document.getElementById("email").value.trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          status.className = "show";
          status.textContent = "Un email valide.";
          return;
        }
        try { localStorage.setItem(NOTE_KEY, email); } catch (e) {}
        showQuiet();
      });
    </script>
  </body>
</html>
